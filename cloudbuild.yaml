# Cloud Build: build apps/web from the repo root (pnpm workspace), push, deploy to Cloud Run (Mumbai).
# Traffic reaches it through the global load balancer at workspace.isocodelabs.com.
substitutions:
  _REGION: asia-south1
  _SERVICE: iclabs-workspace
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/iclabs-workspace/${_SERVICE}
  _MIGRATE_IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/iclabs-workspace/migrate
  _SQL_INSTANCE: ${PROJECT_ID}:asia-south1:iclabs-workspace-mum
  # Space-separated (gcloud uses commas between variables).
  _BOOTSTRAP_ADMIN_EMAILS: devansh@isocodelabs.com aryan@isocodelabs.com
  _BOOTSTRAP_DEACTIVATE_EMAILS: dex@isocodelabs.com

steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/web/Dockerfile", "-t", "${_IMAGE}:${COMMIT_SHA}", "."]

  - id: Build migrate
    name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "apps/web/Dockerfile",
        "--target",
        "migrate",
        "-t",
        "${_MIGRATE_IMAGE}:${COMMIT_SHA}",
        ".",
      ]

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${COMMIT_SHA}"]

  - id: Push migrate
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_MIGRATE_IMAGE}:${COMMIT_SHA}"]

  # Schema first, then the new code. Fails the build (and skips the rollout) if migrations fail.
  - id: Migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - workspace-migrate
      - --image=${_MIGRATE_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=workspace-database-url-mum:latest,BOOTSTRAP_INITIAL_PASSWORD=workspace-bootstrap-password:latest
      - --set-env-vars=BOOTSTRAP_ADMIN_EMAILS=${_BOOTSTRAP_ADMIN_EMAILS},BOOTSTRAP_DEACTIVATE_EMAILS=${_BOOTSTRAP_DEACTIVATE_EMAILS}
      - --max-retries=0
      - --task-timeout=600s
      - --execute-now
      - --wait
      - --quiet

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      # "deploy" creates the first revision or updates an existing one, keeping its settings.
      - run
      - deploy
      - ${_SERVICE}
      - --platform=managed
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --quiet

images:
  - ${_IMAGE}:${COMMIT_SHA}
  - ${_MIGRATE_IMAGE}:${COMMIT_SHA}

# pnpm install + next build of the monorepo can pass the 10-minute default.
timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
